# Zensical configuration for the cellpy-core documentation.
#
# Build locally with:  uv run --group docs zensical serve
# Reference: https://zensical.org/docs/

[project]
site_name = "cellpy-core"
site_description = "Core engine for cellpy: fast, thread-safe step and cycle summarization of battery-cycling raw data."
site_url = "https://cellpy-core.readthedocs.io/"
repo_url = "https://github.com/cellpy/cellpy-core"
repo_name = "cellpy/cellpy-core"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; The cellpy developers
"""

nav = [
    { "Home" = "index.md" },
    { "Getting started" = "getting-started.md" },
    { "User guide" = [
        { "Standalone use" = "user-guide/standalone-use.md" },
        { "The Data object" = "user-guide/data-object.md" },
    ] },
    { "Examples" = [
        "examples/index.md",
        { "Quickstart on mock data" = "examples/quickstart.md" },
        { "Real cycling data walkthrough" = "examples/real_data_walkthrough.md" },
    ] },
    { "Specifications" = [
        { "Harmonized raw format" = "specifications/harmonized-raw.md" },
        { "Step table" = "specifications/step-table.md" },
        { "Cycle table" = "specifications/cycle-table.md" },
    ] },
    { "API reference" = [
        "api/index.md",
        { "Public API" = "api/public.md" },
    ] },
    { "Development" = [
        { "Development guide" = "development/guide.md" },
        { "Design notes" = "development/design-notes.md" },
        { "Issue workflow" = "development/issue-workflow.md" },
        { "Roadmap" = "development/roadmap.md" },
    ] },
    { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/cellpy/cellpy-core"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/cellpycore/"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

# Allows --8<-- includes of files living outside docs/ (HISTORY.md, ROADMAP.md).
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true

# ----------------------------------------------------------------------------
# API reference (mkdocstrings)
# https://zensical.org/docs/setup/extensions/mkdocstrings/
# ----------------------------------------------------------------------------
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "list"
inherited_members = true
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
show_source = false
heading_level = 2
